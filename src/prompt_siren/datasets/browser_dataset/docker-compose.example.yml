# Browser Dataset Docker Compose Configuration
#
# This file sets up all containers for the browser dataset on a shared network.
# The browser container runs Chromium with CDP enabled, allowing Playwright to
# connect remotely. All containers share DNS resolution, so realistic hostnames
# (e.g., gitea.dev-forge.io) resolve correctly.
#
# Usage:
#   docker-compose -f docker-compose.example.yml up -d
#
# Then run experiments with:
#   uv run prompt-siren run benign +dataset=browser dataset.config.cdp_endpoint=http://localhost:9222

services:
  # Browser container - Chromium with CDP enabled
  browser:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    container_name: prompt-siren-browser
    command: >
      chromium
      --remote-debugging-port=9222
      --remote-debugging-address=0.0.0.0
      --no-sandbox
      --disable-gpu
      --disable-dev-shm-usage
      --disable-software-rasterizer
      --headless=new
    ports:
      - "9222:9222"  # Expose CDP port to host
    networks:
      browser-network:
        aliases:
          - browser
    shm_size: 2gb  # Increase shared memory for browser stability

  # Gitea - Git forge (SQLite)
  gitea:
    image: gitea/gitea:latest
    container_name: prompt-siren-gitea
    environment:
      - USER_UID=0
      - USER_GID=0
      - GITEA__server__HTTP_PORT=80
      - GITEA__server__ROOT_URL=http://gitea.dev-forge.io
    volumes:
      - gitea-data:/data
    ports:
      - "3000:80"  # Optional: expose to host for debugging
    networks:
      browser-network:
        aliases:
          - gitea.dev-forge.io  # Hostname for Docker DNS

  # Apache Answer - Q&A platform (SQLite)
  answer:
    image: apache/answer:latest
    container_name: prompt-siren-answer
    volumes:
      - answer-data:/data
    ports:
      - "9080:9080"  # Optional: expose to host for debugging
    networks:
      browser-network:
        aliases:
          - answers.dev-community.io  # Hostname for Docker DNS

  # Wiki.js - Wiki platform (SQLite)
  wikijs:
    image: linuxserver/wikijs:latest
    container_name: prompt-siren-wikijs
    environment:
      - PUID=0
      - PGID=0
      - PORT=80
      - WIKIJS_PORT=80
    volumes:
      - wikijs-data:/config
    ports:
      - "3001:80"  # Map to different host port (3000 used by Gitea)
    networks:
      browser-network:
        aliases:
          - wiki.internal-docs.io  # Hostname for Docker DNS

networks:
  browser-network:
    name: prompt-siren-browser-network
    driver: bridge

volumes:
  gitea-data:
  answer-data:
  wikijs-data:
